services:
  webpack-builder:
    platform: linux/amd64
    image: node:18
    container_name: webpack_builder_whgazetteer-org_main
    logging:
      driver: local
    environment:
      - NODE_ENV=production
    volumes:
      - /home/whgadmin/sites/whgazetteer-org:/app
    working_dir: /app
    command: >
      sh -c "npm install && 
             mkdir -p /app/static && 
             npx webpack --config webpack.config.js && echo 'WEBPACK FINISHED'"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G