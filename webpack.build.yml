services:
  webpack-builder:
    networks:
      - whgazetteer-org_whgazetteer-org
    platform: linux/amd64
    image: node:18
    container_name: webpack_builder_whgazetteer-org_main
    logging:
      driver: local
    env_file:
      - .env/.env
    environment:
      - NODE_ENV=production
    volumes:
      - /home/whgadmin/sites/whgazetteer-org:/app
    working_dir: /app
    command: >
      sh -c "npm install --include=dev && 
             mkdir -p /app/static && 
             npx webpack --config webpack.config.js && echo 'WEBPACK FINISHED'"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

networks:
  whgazetteer-org_whgazetteer-org:
    external: true