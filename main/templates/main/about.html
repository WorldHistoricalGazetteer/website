{% extends "main/base_webpack.html" %}
{% block title %}<title>WHG::About</title>{% endblock %}

{% load static %}

{% block extra_css %}
    /* (Inside the base template's <style>.) Funder logos: the width/height attributes give each its
       proportions and a size no larger than it had on /people_overview/; on a narrow screen
       max-width shrinks it with height:auto (main/tests_layout_oddities.py AboutFunderLogosTests). */
    #funder_logos img {
        max-width: 100%;
        height: auto;
    }
{% endblock %}

{% block content %}
  <div class="container">
    <div class="d-flex justify-content-center mt-3">
      <h1 class="h3">About the World Historical Gazetteer</h1>
    </div>
    <div id="about_content" class="mb-5">
      <div id="vision_mission" class="clearfix">
        {# The Pelagios partner logo takes the space on the right and the text wraps round it (a float, not a reserved column). #}
        <img src="{% static 'images/pelagioslogo_partner.svg' %}" width="213" class="float-end ms-4 mb-2 mt-1"
             style="max-width: 40%; height: auto;" alt="Pelagios Network partner"/>
        <h2 class="h5">Our vision</h2>
        <p>Empowering discovery by connecting place names across time and language.</p>
        <h2 class="h5">Our mission</h2>
        <p>The mission of the World Historical Gazetteer is to build a platform for open linked historical place data in order to foster deeper understanding of place history and to improve discovery of places that have had many names over time. The WHG place index is accessible through tools and services that permit users to search and browse information about places, augment and contribute their own place records, assemble and publish information about places, and use information about places in teaching and communication.
        </p>
        {% if PRINCIPLES_PAGE_ENABLED %}
        <p>The <a href="{% url 'principles' %}">principles</a> behind this work set out what WHG is, how it models places, and what it values.</p>
        {% endif %}
      </div>

      <h2 id="status" class="h5">Current status</h2>
      <p>Development of the WHG platform is always ongoing. New content is added continually, from contributions of users and by WHG staff. The current release is
        <a href="https://github.com/WorldHistoricalGazetteer/website/releases/tag/v{{ APP_VERSION }}" target="_blank" rel="noopener">version {{ APP_VERSION }}</a>;
        new tools are tested with a group of beta testers before they are released to everyone. Announcements of new features and data appear under
        <a href="{% url 'announcements-list' %}">News &amp; announcements</a>, and the
        <a href="https://docs.whgazetteer.org/" target="_blank" rel="noopener">project documentation</a> explains what you can do on the platform today.</p>
      <p>Please <a data-whg-modal="/contact_modal/" href="#">get in touch</a> to discuss prospective data contributions, and with feedback about any aspect of the project.</p>

      {# Moved here from /people_overview/ (which keeps a pointer to #funding). #}
      <section id="funding" aria-labelledby="funding-heading">
        <h2 id="funding-heading" class="h5">Funding and awards</h2>
        <p class="mb-1">
          The project was initiated in 2017 under a 3-year Preservation and Access grant from the US National Endowment for the Humanities (NEH)
          (<a href="https://securegrants.neh.gov/publicquery/main.aspx?f=1&amp;gn=PW-253719-17" target="_blank" rel="noopener">PW‑253719‑17</a>).
        </p>
        <p class="mb-1">
          In January, 2023 the project was awarded a 3-year Digital Humanities Advancement Grant from the NEH.
        </p>
        <p class="mb-1">
          Since 2025, it has been supported by ongoing in-kind contributions from the
          <a href="https://www.ishi.pitt.edu/" target="_blank" rel="noopener">University of Pittsburgh Institute for Spatial History Innovation</a>.
        </p>
        <p class="mb-1">
          From 2017 to 2025, it was supported by the
          <a href="https://www.worldhistory.pitt.edu" target="_blank" rel="noopener">University of Pittsburgh World History Center</a>.
        </p>
        <p class="mb-1">
          Development of Version 2 in 2021 and further improvements in 2022 were generously supported by the
          <a href="https://huc.knaw.nl/" target="_blank" rel="noopener">KNAW Humanities Cluster</a> in the Netherlands.
        </p>
        <p class="mb-1">
          The <a href="https://www.ucis.pitt.edu/asc/" target="_blank" rel="noopener">Asian Studies Center at Pitt</a> has supported development of the
          <b>Teaching with WHG</b> section of the site and the Place Collection feature introduced in v2.1.
        </p>
        <p class="mb-1">
          The <a href="https://www.ucis.pitt.edu/crees/" target="_blank" rel="noopener">Center for Russian, East European, and Eurasian Studies</a> at Pitt has supported development of the Dataset Collection feature and exemplar data in that broad region.
        </p>
        <p>
          World Historical Gazetteer received the 2021 "<b>Best DH Tool or Suite of Tools Award</b>" from
          <a href="http://dhawards.org/dhawards2021/results/" target="_blank" rel="noopener">Digital Humanities Awards</a>.
        </p>
        <p class="mb-1">
          WHG's search and indexing infrastructure runs on computing resources provided by the University of Pittsburgh
          <a href="https://crc.pitt.edu/" target="_blank" rel="noopener">Center for Research Computing and Data</a>.
        </p>
        {# The funders' logos, moved here from /people_overview/ (the Pelagios partner logo is in #vision_mission above). #}
        <div id="funder_logos" class="d-flex flex-wrap align-items-center gap-4 mt-3 mb-4">
          <img src="{% static 'images/neh_logo_horizontal_rgb.jpg' %}" width="220" height="54"
               alt="National Endowment for the Humanities">
          <img src="{% static 'images/ishi_logo.png' %}" width="104" height="107"
               alt="Institute for Spatial History Innovation (ISHI): a tree with topographic contour lines">
          {# The University's white shield-and-wordmark is for a dark background: Pitt Royal Blue (#003594). #}
          <span class="d-inline-block px-3 py-2 rounded-1" style="background-color: #003594;">
            <img src="{% static 'images/pitt_shield_white.png' %}" width="170" height="53" class="d-block"
                 alt="University of Pittsburgh">
          </span>
          <img src="{% static 'images/whc_logo250.png' %}" width="160" height="80"
               alt="Pitt World History Center">
          <img src="{% static 'images/logo-knaw-humanities-cluster.png' %}" width="90" height="71"
               alt="KNAW Humanities Cluster">
          <img src="{% static 'images/logo-asc-pitt.png' %}" width="200" height="62"
               alt="Asian Studies Center, University of Pittsburgh">
          <img src="{% static 'images/logo-creees-pitt.png' %}" width="250" height="53"
               alt="Center for Russian, East European and Eurasian Studies, University of Pittsburgh">
          <img src="{% static 'images/dhaward.png' %}" width="250" height="60"
               alt="DH Awards 2021 winner: Best DH tool or suite of tools">
        </div>
      </section>

      <h2 id="more" class="h5">Find out more</h2>
      <ul>
        <li><a href="https://docs.whgazetteer.org/" target="_blank" rel="noopener">Documentation</a>: guides, tutorials and technical reference</li>
        {% if PRINCIPLES_PAGE_ENABLED %}
        <li><a href="{% url 'principles' %}">Principles</a></li>
        {% endif %}
        <li><a href="{% url 'credits' %}">People &amp; credits</a>: the project team, former members, advisory board and acknowledgements</li>
        <li><a href="{% url 'publications' %}">Publications &amp; press</a></li>
        <li><a href="{% url 'licenses' %}">Data licences</a> and <a href="{% url 'software-licenses' %}">software licences</a>; WHG's own <a data-whg-modal="/license/" href="#">licensing policy</a></li>
        {# terms/privacy/licence are unstyled fragments: open them as modals, as the footer does #}
        <li><a data-whg-modal="{% url 'terms_of_use' %}" href="#">Terms of use</a> and <a data-whg-modal="{% url 'privacy_policy' %}" href="#">privacy policy</a></li>
        <li><a href="https://github.com/WorldHistoricalGazetteer/whg3" target="_blank" rel="noopener">Source code</a> and
          <a href="https://github.com/WorldHistoricalGazetteer/website/releases" target="_blank" rel="noopener">release notes</a></li>
      </ul>
    </div>
  </div>
{% endblock %}
