[project]
name = "whg-mcp"
version = "0.2.0"
description = "Read-only MCP server over the World Historical Gazetteer API (service-token authenticated)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.30,<1.31", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
