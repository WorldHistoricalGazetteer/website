[project]
name = "whg-mcp"
version = "0.1.0"
description = "Read-only MCP server over the public World Historical Gazetteer API"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
