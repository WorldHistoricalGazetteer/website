{% comment %}The "Download matches" button. Pass `cls` (button classes) and optionally `bid` (element id).{% endcomment %}<a class="{{ cls }}" {% if bid %}id="{{ bid }}" {% endif %}data-testid="mf-export"
   href="{% url 'datasets:ds_matches_export' ds.id %}" download rel="tooltip" data-bs-html="true" data-bs-placement="bottom" data-bs-custom-class="dl-matches-tip"
   title="Download your matches as a spreadsheet (CSV): each of your places, the place you matched it to, and what WHG holds about that place (names, type, location, dates, licence).&lt;br&gt;&lt;br&gt;Good to know:&lt;br&gt;&bull; Only your own matches are included. Matches you have undone are left out.&lt;br&gt;&bull; The place details are looked up when you download, so a later download may differ.&lt;br&gt;&bull; Some sources do not allow their data to be copied. For those you get only the id and source, and the last column says why.&lt;br&gt;&bull; If WHG cannot be reached the file says so in the &lt;em&gt;matched_detail&lt;/em&gt; column. Download again later.&lt;br&gt;&bull; This is a spreadsheet, not your dataset in Linked Places format (LPF). An enriched LPF file is not available yet: your gazetteer would first need to be published and indexed in WHG.">Download matches</a>
<style>.dl-matches-tip .tooltip-inner{max-width:380px;text-align:left;font-size:.8rem}</style>
